<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Qing Zhang. PhD student, Australian National University. Robot learning and vision foundation models.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16324e"/>
      <stop offset="1" stop-color="#0c1f33"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="tip" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#e2bd63"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <!-- left: name and line -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">
    <text x="72" y="134" font-size="68" font-weight="600" letter-spacing="0.5">Qing Zhang</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="74" y="180" font-size="24" fill="#c7d5e2">PhD Student · Australian National University</text>
    <rect x="74" y="206" width="56" height="3" rx="1.5" fill="#e2bd63"/>
    <text x="74" y="246" font-size="19" fill="#9fb3c6">What information robots need to act, whether vision models</text>
    <text x="74" y="272" font-size="19" fill="#9fb3c6">already hold it, and why policies fail to use it.</text>
  </g>

  <!-- right: seeing is not reaching -->
  <g transform="translate(760 0)">
    <rect x="0" y="48" width="372" height="224" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- table -->
    <line x1="28" y1="222" x2="344" y2="222" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <!-- gripper start -->
    <g transform="translate(70 96)" stroke="#c7d5e2" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M-12 -6V8M12 -6V8M-12 -6H12M0 -6V-22"/>
    </g>
    <!-- path to where the object used to be -->
    <path d="M70 110 C 95 160, 120 196, 146 206" fill="none" stroke="#9fb3c6" stroke-opacity="0.7" stroke-width="2.5" stroke-dasharray="6 7"/>
    <circle cx="160" cy="206" r="14" fill="none" stroke="#9fb3c6" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="4 5"/>
    <!-- path to where the object is -->
    <path d="M70 110 C 150 70, 250 110, 286 190" fill="none" stroke="#e2bd63" stroke-width="3" marker-end="url(#tip)"/>
    <circle cx="296" cy="206" r="14" fill="#7fb8d4"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="160" y="248" text-anchor="middle" fill="#9fb3c6">training place</text>
      <text x="300" y="248" text-anchor="middle" fill="#c7d5e2">where it is now</text>
      <text x="344" y="80" text-anchor="end" fill="#e2bd63">seeing ≠ reaching</text>
    </g>
  </g>
</svg>
